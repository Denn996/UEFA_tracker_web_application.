<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UEFA Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    {% if user.is_authenticated %}
    <div class="top-nav" style="background-color: #1a1a1a; color: rgb(47, 240, 29); padding: 15px; display: flex; justify-content: space-between; align-items: center;">
        <div class="logo">⚽ UEFA Tracker</div>
        <div class="links">
            <a href="{% url 'standings' %}" style="color: white; margin-right: 15px; text-decoration: none;"><button class="btn btn-outline-light">🏆 Standings</button></a>
            <a href="{% url 'matches' %}" style="color: white; margin-right: 15px; text-decoration: none;"><button class="btn btn-outline-light">📅 Match Results</button></a>
            <a href="{% url 'logout' %}" style="color: white; text-decoration: none;"><button class="btn btn-outline-light">🚪 Log Out</button></a>
        </div>
    </div>
    {% endif %}

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>


  

</body>
</html>
