{% extends 'league/home.html' %}

{% block content %}

<h2>Log In</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-outline-light" type="submit">Log In</button>
</form>
<p>Don't have an account? <a href="{% url 'signup' %}"><button class="btn btn-outline-light">Sign Up here</button></a></p>

{% endblock %}
