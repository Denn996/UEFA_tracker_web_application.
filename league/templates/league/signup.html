{% extends "league/home.html" %}

{% block content %}

<h2>Create an Account</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-outline-light" type="submit">Sign Up</button>
</form>
<p>Already have an account? <a href="{% url 'login' %}"><button class="btn btn-outline-light">Log In here</button></a></p>

{% endblock %}
